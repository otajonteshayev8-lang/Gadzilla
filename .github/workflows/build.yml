name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: unzip GadzillaEnchants.zip
      - run: mvn -B package
        working-directory: GadzillaEnchants
      - uses: actions/upload-artifact@v4
        with:
          name: GadzillaEnchants
          path: GadzillaEnchants/target/GadzillaEnchants-1.0.jar
